name: Publish

# Merging a version bump to main is the publish action.
#
# The job is a no-op unless package.json's version is missing from npm OR from
# the MCP Registry, so ordinary merges to main do nothing. The two are checked
# separately so a run that published to npm but failed at the registry can be
# finished by re-running this workflow (workflow_dispatch): npm is skipped, the
# registry step runs. To release: bump the version in
# package.json AND server.json (both places), open a PR, merge it.
#
# Approving that PR is therefore approving the release. A second gate sits on the
# `publish` environment — add required reviewers to it in repo settings and the
# job will wait for a human even after the merge.
#
# Publication is not reversible. npm allows unpublish for 72 hours and then the
# name and version are permanent; the MCP registry entry propagates to Smithery,
# Glama and MCPfinder within about 24 hours.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should-publish: ${{ steps.compare.outputs.changed }}
      version: ${{ steps.compare.outputs.version }}
      on-npm: ${{ steps.compare.outputs.on-npm }}
      on-registry: ${{ steps.compare.outputs.on-registry }}
    steps:
      - uses: actions/checkout@v4

      - name: Versions in package.json and server.json must agree
        run: |
          PKG=$(jq -r .version package.json)
          SRV=$(jq -r .version server.json)
          SRV_PKG=$(jq -r '.packages[0].version' server.json)
          echo "package.json=$PKG server.json=$SRV server.json/packages[0]=$SRV_PKG"
          if [ "$PKG" != "$SRV" ] || [ "$PKG" != "$SRV_PKG" ]; then
            echo "::error::version mismatch — bump package.json, server.json (.version) and server.json (.packages[0].version) together"
            exit 1
          fi

      - name: Is this version already on npm and on the MCP Registry?
        id: compare
        run: |
          NAME=$(jq -r .name package.json)
          SERVER=$(jq -r .name server.json)
          LOCAL=$(jq -r .version package.json)
          echo "version=$LOCAL" >> "$GITHUB_OUTPUT"
          # Ask for this exact version: `npm view name version` returns the latest
          # tag, which says nothing about whether THIS version exists.
          if [ "$(npm view "$NAME@$LOCAL" version 2>/dev/null)" = "$LOCAL" ]; then ON_NPM=true; else ON_NPM=false; fi
          # The registry lists every published version of a server; a 404 or an
          # unreachable registry reads as "not there", so the publish step runs
          # and fails loudly rather than being skipped silently.
          ENC=$(jq -rn --arg s "$SERVER" '$s|@uri')
          if curl -fsS "https://registry.modelcontextprotocol.io/v0/servers/$ENC/versions" \
               | jq -e --arg v "$LOCAL" '[.servers[]?.server.version] | index($v) != null' >/dev/null; then
            ON_REG=true; else ON_REG=false; fi
          echo "on-npm=$ON_NPM" >> "$GITHUB_OUTPUT"
          echo "on-registry=$ON_REG" >> "$GITHUB_OUTPUT"
          echo "local=$LOCAL on-npm=$ON_NPM on-registry=$ON_REG"
          if [ "$ON_NPM" = true ] && [ "$ON_REG" = true ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "$NAME@$LOCAL is on npm and $SERVER@$LOCAL is on the MCP Registry — nothing to do." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Will publish $LOCAL (on npm: $ON_NPM, on the MCP Registry: $ON_REG)." >> "$GITHUB_STEP_SUMMARY"
          fi

  publish:
    needs: check
    # PUBLISH_ENABLED is an explicit off switch and it defaults to off: an unset
    # repo variable is an empty string, so this job does nothing until someone
    # sets it to 'true' in Settings → Secrets and variables → Actions → Variables.
    # Without it, merging this workflow would publish on the very next push to
    # main, and a GitHub environment with no reviewers configured is not a gate.
    if: needs.check.outputs.should-publish == 'true' && vars.PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    # Second gate. Add required reviewers to this environment in repo settings and
    # the job waits for a human even after the merge.
    #
    # The name must match the environment holding MCP_DNS_PRIVATE_KEY exactly —
    # environment secrets are visible only to jobs that declare that environment,
    # and a mismatch reads as a missing secret rather than a naming error. It must
    # also match the Environment name on the npm Trusted Publisher entry, if set.
    #
    # PUBLISH_ENABLED is deliberately NOT an environment variable. The job-level
    # `if` below is evaluated before the environment is resolved, so `vars` holds
    # only repository and organization variables at that point. An environment
    # variable there is empty, the condition is never true, and the job silently
    # never runs.
    environment: Live
    permissions:
      contents: read
      # Lets the runner mint the OIDC token npm exchanges for publish rights.
      # Without it there is no credential at all — see the npm step below.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      # Trusted Publishing needs npm >= 11.5.1 and Node 22 ships npm 10.x, which
      # has no OIDC path at all. An old npm here does not fail loudly — it looks
      # for a token, finds none, and dies with an auth error that reads like a
      # missing secret. So assert the version rather than hoping for it.
      - name: npm new enough for OIDC
        run: |
          npm install -g npm@latest
          NPM_V=$(npm --version)
          echo "npm $NPM_V"
          MIN=11.5.1
          if [ "$(printf '%s\n%s\n' "$MIN" "$NPM_V" | sort -V | head -1)" != "$MIN" ]; then
            echo "::error::npm $NPM_V is older than $MIN — Trusted Publishing is unavailable."
            exit 1
          fi

      - run: npm ci
      - run: npm test

      # No NODE_AUTH_TOKEN, deliberately. npm authenticates by exchanging the
      # runner's OIDC token for short-lived publish rights, so there is no
      # long-lived credential to leak, rotate, or have expire mid-quarter — and
      # npm is actively restricting the 2FA-bypass tokens this replaces.
      #
      # Setting NODE_AUTH_TOKEN would actively BREAK this: npm prefers the token
      # path when one is present, silently bypassing OIDC. If you ever reintroduce
      # a token, remove Trusted Publishing rather than running both.
      #
      # Requires a Trusted Publisher configured on npmjs.com for @shumi-ai/mcp:
      # owner `shumi-ai`, repository `shumi-mcp`, workflow `publish.yml`. The
      # workflow filename is part of the trust relationship — renaming this file
      # breaks publishing until the publisher entry is updated to match.
      - name: Publish to npm
        if: needs.check.outputs.on-npm != 'true'
        run: npm publish

      # The registry validates the package against npm, and a fresh version can
      # 404 there for a minute or two. Registering straight after `npm publish`
      # failed for 1.2.0 and 1.2.1 ("version ... was not found (status: 404)").
      - name: Wait until npm serves this version
        if: needs.check.outputs.on-registry != 'true'
        run: |
          NAME=$(jq -r .name package.json)
          V=${{ needs.check.outputs.version }}
          for _ in $(seq 1 40); do
            [ "$(npm view "$NAME@$V" version 2>/dev/null)" = "$V" ] && { echo "npm serves $NAME@$V"; exit 0; }
            sleep 15
          done
          echo "::error::npm still does not serve $NAME@$V after 10 minutes"
          exit 1

      - name: Install mcp-publisher
        if: needs.check.outputs.on-registry != 'true'
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to the MCP Registry
        if: needs.check.outputs.on-registry != 'true'
        # DNS auth, not github-oidc: the server is named `ai.shumi/mcp`, and OIDC
        # only grants the `io.github.*` namespace. Requires an apex TXT record on
        # shumi.ai — see PUBLISHING.md.
        run: ./mcp-publisher login dns --domain=shumi.ai --private-key="$MCP_DNS_PRIVATE_KEY"
        env:
          MCP_DNS_PRIVATE_KEY: ${{ secrets.MCP_DNS_PRIVATE_KEY }}

      - name: Publish to the MCP Registry
        if: needs.check.outputs.on-registry != 'true'
        run: ./mcp-publisher publish

      - name: Summary
        run: |
          echo "Published \`$(jq -r .name package.json)@${{ needs.check.outputs.version }}\` to npm and \`$(jq -r .name server.json)\` to the MCP Registry." >> "$GITHUB_STEP_SUMMARY"
          echo "Smithery, Glama and MCPfinder aggregate from the registry within ~24h." >> "$GITHUB_STEP_SUMMARY"
